<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Guestbook</title>
    <!-- link font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <!-- link bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <!-- link css -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar md:navbar-expand bg-muted-accent">
        <div class="container">
            <a href="#" class="navbar-brand">Guest Book</a>
            <div class="mb-2 md:ms-auto">
                <ul class="nav navbar-nav">
                    <li class="nav-item">
                        <a href="#" class="nav-link active" aria-current="page">Home</a>
                    </li>
                    <li class="nav-item">
                        <a href="#contact" class="nav-link">About Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <section class="main py-5 bg-white">
            <div class="container">
                <div class="row g-4 my-9">
                    <div class="col-12 md:col-6 lg:col-4">
                        <div class="guestbook-form">
                            <h1 class="title h4 bg-muted-accent">Leave Message</h1>
                            <form id="guestbookForm" class="form">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Full Name: </label>
                                    <input type="text" id="name" name="name" placeholder="Enter your full name" class="form-control">
                                </div>
                                <div class="mb-7">
                                    <label for="message" class="form-label">Message: </label>
                                    <textarea name="message" id="message" placeholder="Write your message here" class="form-control"></textarea>
                                </div>
                                <input type="submit" value="Submit Message" class="submit btn btn-solid theme-accent">
                            </form>
                        </div>
                    </div>
                    <div class="col-12 md:col-6 lg:col-8">
                        <div class="guestbook">
                            <h1 class="h4">New Messages</h1>
                            <hr>
                            <ul id="messageList" class="guestbookCard"></ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer class="bg-muted-accent py-5">
        <div id="contact">
            <p>Connect with Us</p>
            <a href="#"><i class="i fa-brands fa-linkedin"></i></a>
            <a href="#"><i class="i fa-brands fa-x-twitter"></i></a>
            <a href="#"><i class="i fa-brands fa-instagram"></i></a>
            <a href="#"><i class="i fa-brands fa-github"></i></a>
        </div>
        <p class="pfooter">&copy; 2026 Interactive Guest Book. All right reserved.</p>
    </footer>




    <!-- file js -->
    <script src="assets/js/script.js"></script>
</body>
</html>
